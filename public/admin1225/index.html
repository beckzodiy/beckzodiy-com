<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Publisher — beckzodiy.com</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-admin-page>
    <header class="site-head"><a href="/">beckzodiy.com</a><div class="head-actions"><button class="theme-toggle" data-theme-toggle aria-label="Switch color theme">☾</button><button class="quiet" data-logout hidden>Log out</button></div></header>
    <main class="home admin" data-admin-shell>
      <div class="home-title"><h1>Publisher</h1><button class="primary" data-new hidden>Write</button></div>
      <nav class="tabs" role="tablist" data-tabs hidden><button role="tab" data-tab="stats">Dashboard</button><button role="tab" data-tab="articles">Articles</button></nav>
      <section data-panel="stats" hidden></section>
      <section data-panel="articles">
        <form class="search admin-search" data-admin-search role="search" hidden><input type="search" name="q" placeholder="Search your articles" aria-label="Search articles" autocomplete="off"><button type="submit">Search</button></form>
        <div class="article-list" data-list><p class="muted">Checking access…</p></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
